<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admission Registration - Nilmadhav International School</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            background-color: #FFFFFF;
            color: #1E3D59;
            text-align: center;
            padding: 20px;
            width: 100%;
            font-weight: 700;
            font-size: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-transform: uppercase;
            border-bottom: 4px solid #D84315;
        }
        .container {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 500px;
            max-width: 90%;
            padding: 30px 40px;
            margin: 30px 0 60px;
        }
        h2 { 
            text-align: center; 
            color: #2E7D32; 
            margin-bottom: 25px; 
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        .section-title {
            font-size: 0.9rem;
            color: #D84315;
            text-transform: uppercase;
            margin: 20px 0 10px 0;
            font-weight: bold;
            border-left: 4px solid #D84315;
            padding-left: 10px;
        }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 600; }
        
        input[type="text"], 
        input[type="tel"], 
        input[type="email"], 
        input[type="date"], 
        select {
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border: 2px solid #C8E6C9; 
            border-radius: 8px;
            font-family: inherit;
            outline: none;
        }
        
        input:focus {
            border-color: #4CAF50;
            background-color: #F1F8E9;
        }

        .radio-group {
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            padding: 5px;
        }

        .submit-btn {
            width: 100%; 
            padding: 16px; 
            background-color: #1E3D59; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover { 
            background-color: #D84315; 
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="header">Nilmadhav International School</div>
    <div class="container">
        <h2>Admission Form</h2>
        
        <form action="/submit" method="POST">
            
            <div class="section-title">Student Information</div>
            
            <label for="username">Student Full Name:</label>
            <input type="text" id="username" name="username" placeholder="Full name as per Aadhar" required />
            
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required />

            <label for="standard">Standard Applying For:</label>
            <select id="standard" name="standard" required>
                <option value="" disabled selected>Select standard</option>
                <option value="Nursery">Nursery</option>
                <option value="LKG">LKG</option>
                <option value="UKG">UKG</option>
                <option value="I">I</option>
                <option value="II">II</option>
                <option value="III">III</option>
                <option value="IV">IV</option>
                <option value="V">V</option>
                <option value="VI">VI</option>
                <option value="VII">VII</option>
                <option value="VIII">VIII</option>
                <option value="IX">IX</option>
                <option value="X">X</option>
                <option value="XI">XI</option>
                <option value="XII">XII</option>
            </select>

            <label>Gender:</label>
            <div class="radio-group">
                <label style="font-weight: normal;"><input type="radio" name="gender" value="Male" required> Male</label>
                <label style="font-weight: normal;"><input type="radio" name="gender" value="Female" required> Female</label>
            </div>

            <label for="blood_group">Blood Group:</label>
            <select id="blood_group" name="blood_group">
                <option value="" disabled selected>Select Blood Group</option>
                <option value="A+">A+</option><option value="A-">A-</option>
                <option value="B+">B+</option><option value="B-">B-</option>
                <option value="O+">O+</option><option value="O-">O-</option>
                <option value="AB+">AB+</option><option value="AB-">AB-</option>
            </select>

            <div class="section-title">Parental Details</div>

            <label for="father_name">Father's Full Name:</label>
            <input type="text" id="father_name" name="father_name" placeholder="Enter father's name" required />

            <label for="mother_name">Mother's Full Name:</label>
            <input type="text" id="mother_name" name="mother_name" placeholder="Enter mother's name" required />
            
            <label for="parent_email">Parent's Email Address:</label>
            <input type="email" id="parent_email" name="parent_email" placeholder="example@email.com" required />
            
            <label for="parent_mobile">Primary Mobile Number:</label>
            <input type="tel" id="parent_mobile" name="parent_mobile" placeholder="10-digit number" pattern="[0-9]{10}" required />

            <label for="address">Residential Address:</label>
            <input type="text" id="address" name="address" placeholder="Flat No, Building, Area, City" required />

            <button class="submit-btn" type="submit">Confirm Registration</button>
        </form>
    </div>
</body>
</html>
